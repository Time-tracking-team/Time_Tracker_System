<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracking System</title>

    <link rel="stylesheet" href="login.css">
</head>
    <!-- <a href="dashboard.html">Login</a> -->
<body>

    <!-- Main Container -->

    <div class="container">

        <!-- Login Box -->

        <div class="login-box">

            <h2>Welcome Back</h2>

            <p>Login to continue</p>

            <!-- Login Form -->

            <form id="loginForm">

                <!-- Email -->

                <div class="input-box">

                    <input type="email" id="email" placeholder="Email" required>

                </div>

                <!-- Password -->

                <div class="input-box">

                    <input type="password" id="password" placeholder="Password" required>

                </div>

                <!-- Login Button -->

                <button type="submit">

                    <!-- Login -->
                    <a href="dashboard.html">Login</a>

                </button>

            </form>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
